<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiliCards — Winner Screen Preview</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:#4a2f1d;
    background:radial-gradient(1200px 700px at 85% -10%, #fbe3c2 0%, transparent 60%),
               radial-gradient(900px 600px at -10% 110%, #f0d0b4 0%, transparent 55%),
               linear-gradient(160deg,#f7e9d7 0%,#f3ddc4 100%);
    min-height:100vh;
  }
  .caption{
    text-align:center;padding:18px 16px 0;font-weight:700;color:#7a5a41;font-size:14px;
  }
  .overlay{
    position:relative;min-height:calc(100vh - 44px);
    background:rgba(58,36,22,.42);backdrop-filter:blur(5px);
    display:flex;align-items:center;justify-content:center;padding:24px 16px;
  }
  .panel{
    background:linear-gradient(180deg,#fffbf4 0%,#fdf1e0 100%);
    border-radius:28px;box-shadow:0 18px 40px -18px rgba(90,50,20,.45), inset 0 2px 0 rgba(255,255,255,.8);
    padding:22px;max-width:440px;width:100%;text-align:center;
  }
  .end-mascot{width:110px;margin:0 auto 4px}
  .end-mascot img{width:100%}
  .end-title{font-size:26px;font-weight:800;margin:4px 0 12px;color:#d96f3f}
  .score-chips{display:flex;gap:10px;margin-bottom:14px}
  .fchip{
    flex:1;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:14px;
    background:linear-gradient(180deg,#fff7ec,#fbecd9);border:1.5px solid rgba(122,90,65,.13);text-align:left;
  }
  .fchip.win{background:linear-gradient(180deg,#fff7e0,#ffedc9);border-color:rgba(232,176,75,.55)}
  .fchip-av{width:38px;height:38px;border-radius:50%;flex:0 0 auto;background:#f3e2cc;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .fchip-av img{width:32px;height:32px}
  .fchip-main{flex:1;min-width:0;display:flex;flex-direction:column}
  .fchip-name{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fchip-crown{color:#e8b04b;font-size:11px;font-weight:800}
  .fchip-score{font-weight:800;font-size:18px;color:#d96f3f}
  .postcards-title{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#a8876a;margin:14px 0 10px}
  .postcards-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .pc-item{display:flex;flex-direction:column;gap:5px}
  .pc-frame{border-radius:14px;overflow:hidden;box-shadow:0 8px 20px -10px rgba(90,50,20,.4);background:#eee}
  .pc-img{display:block;width:100%;height:100%;object-fit:cover}
  .pc-label{font-size:10.5px;font-weight:700;color:#a8876a;text-align:center;letter-spacing:.04em}
  .pc-actions{display:flex;gap:6px}
  .pc-btn{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;
    padding:8px 6px;border-radius:999px;background:#fff7ec;color:#7a5a41;font-weight:700;font-size:11.5px;
    box-shadow:0 8px 20px -10px rgba(90,50,20,.4), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .btn-row{display:flex;gap:10px;margin-top:16px}
  .btn{
    flex:1;display:inline-flex;align-items:center;justify-content:center;gap:9px;
    padding:13px 14px;border-radius:999px;font-weight:700;font-size:14.5px;
    background:#fff7ec;color:#4a2f1d;box-shadow:0 8px 20px -10px rgba(90,50,20,.4), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .btn.primary{background:linear-gradient(180deg,#ff9d6b 0%,#d96f3f 100%);color:#fff;box-shadow:0 12px 26px -10px rgba(217,111,63,.65), inset 0 1px 0 rgba(255,255,255,.35)}
  .end-foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .mini-link{font-size:12px;font-weight:700;color:#a8876a}
  .mini-logo img{width:24px;height:24px}
</style></head>
